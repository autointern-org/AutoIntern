# AutoIntern whitelist — JSON / requests-only ATS boards.
# Tier 1 first (priority order), then tier 2 (alphabetical).
#
# Skipped:
#   HashiCorp (IBM), Replicate (Cloudflare-blocked Greenhouse), Cruise (closed), Weights &
#   Biases (CoreWeave board), Ansys (Synopsys), AI21 (Comeet API needs a private token;
#   roles mostly in Israel), ASML (server-rendered only), Palantir / Anduril / Lockheed
#   Martin (excluded by choice), Spring Health and Marqeta (no public board found). Spotify's Lever board covers only part of its hiring.
# iCIMS classic portals use adapter icims; iCIMS Jibe sites (custom domains, *.jibeapply.com)
# expose the same /api/jobs API as Phenom "get" sites.
# Aurora posts on Ashby (aurora-operations-inc); Rippling on its own ATS board API;
# Hugging Face on Workable; ServiceNow on SmartRecruiters.
# LinkedIn scrapes the public guest job search (slug = LinkedIn company id) and runs
# on the laptop runner only, like Tesla: its endpoint rate-limits datacenter IPs.
# Citadel, Citadel Securities, and Palo Alto Networks also run on the laptop: their
# WAFs challenge or block GitHub's IP range.
# DoorDash uses greenhouse doordashusa (not the HTML marketing site).
# Uber uses Oracle Recruiting Cloud (not the dead search API).
# Etsy uses Workday (sitemap fallback exists but is not used here).
# HRT jobs live on greenhouse wehrtyou (hrtcampus is an empty campus board).

