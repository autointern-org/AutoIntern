name: Coverage audit

# Weekly cross-check against the community SimplifyJobs Summer 2027 list:
# companies not scanned, postings that pass the filters but were never
# pinged, and the companies whose postings close fastest.
on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC (08:00 Pacific)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit coverage
        env:
          DISCORD_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_WEBHOOK_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: PYTHONPATH=. python -m scripts.coverage_audit
