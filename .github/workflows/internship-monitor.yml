name: Internship monitor

on:
  schedule:
    # Hourly backup when the laptop timer is asleep. Real 15-min ticks come from
    # laptop `gh workflow run` (workflow_dispatch). GitHub's */15 schedule is delayed.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: Wipe KV seen/bootstrap keys for a clean first-look recap
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: internship-cloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset KV state
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset_state == 'true' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: PYTHONPATH=. python -m scripts.reset_kv

      - name: Scan career sites
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          DISCORD_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SCAN_SKIP_COMPANIES: tesla
        run: PYTHONPATH=. python -m scripts.scan

  # Laptop-only companies (Akamai/Chrome). Add more names to SCAN_ONLY_COMPANIES later the same way.
  # SECURITY: this job runs on a personal machine. Never add pull_request /
  # pull_request_target triggers to this workflow; a fork's PR could then execute
  # on that machine. Only schedule and workflow_dispatch are allowed.
  tesla:
    runs-on: self-hosted
    timeout-minutes: 10
    concurrency:
      group: tesla-home
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt

      - name: Scan Tesla
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          DISCORD_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SCAN_ONLY_COMPANIES: tesla
          TESLA_CHROME_JS: "1"
        run: PYTHONPATH=. .venv/bin/python -m scripts.scan
