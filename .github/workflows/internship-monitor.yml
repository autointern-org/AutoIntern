name: Internship monitor

on:
  schedule:
    # Hourly backup when the laptop timer is asleep. Real 15-min ticks come from
    # laptop `gh workflow run` (workflow_dispatch). GitHub's */15 schedule is delayed.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: Wipe KV seen/bootstrap keys for a clean first-look recap
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  scan:
    # Workday boards must be fetched one at a time per IP, so they are split
    # across parallel shards (separate runners); shard 0 also scans every
    # non-Workday board. Keep SCAN_SHARD's denominator equal to the matrix size.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: internship-cloud-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset KV state
        if: ${{ matrix.shard == 0 && github.event_name == 'workflow_dispatch' && github.event.inputs.reset_state == 'true' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: PYTHONPATH=. python -m scripts.reset_kv

      - name: Scan career sites
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          DISCORD_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCAN_SKIP_COMPANIES: tesla,linkedin,citadel,citadel-securities,palo-alto-networks
          SCAN_SHARD: ${{ matrix.shard }}/4
        run: PYTHONPATH=. python -m scripts.scan

      # Runs even when the laptop is asleep (hourly schedule), and alerts only
      # when the laptop timer is dispatching but no laptop job is running.
      - name: Check laptop runner
        if: ${{ always() && matrix.shard == 0 }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_WEBHOOK_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LAPTOP_COMPANIES: tesla, linkedin, citadel, citadel-securities, palo-alto-networks
        run: PYTHONPATH=. python -m scripts.check_laptop_runner

  # Laptop-only companies: Tesla (Akamai), LinkedIn (rate-limits datacenter IPs),
  # Citadel + Citadel Securities (Cloudflare challenge on GitHub IPs), Palo Alto Networks
  # (WAF serves HTML to GitHub IPs). Add more names
  # to both SCAN_ONLY_COMPANIES and SCAN_SKIP_COMPANIES the same way.
  # SECURITY: this job runs on a personal machine. Never add pull_request /
  # pull_request_target triggers to this workflow; a fork's PR could then execute
  # on that machine. Only schedule and workflow_dispatch are allowed.
  tesla:
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: tesla-home
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt

      - name: Scan Tesla
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          DISCORD_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCAN_ONLY_COMPANIES: tesla,linkedin,citadel,citadel-securities,palo-alto-networks
          TESLA_CHROME_JS: "1"
        run: PYTHONPATH=. .venv/bin/python -m scripts.scan
